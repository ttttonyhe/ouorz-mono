name: Analytics App Tests

on:
  push:
    branches:
      - main
    paths:
      - "apps/analytics/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/analytics/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/**"

jobs:
  run-smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Dependabot pull requests cannot read the repository secrets, and the build
      # only reads the scheme off `DATABASE_URL` to pick a Prisma schema. Nothing
      # connects, so a placeholder keeps those runs meaningful instead of failing
      # on an empty value.
      - name: Setup environment variables
        run: |
          touch apps/analytics/.env
          echo DATABASE_URL=${{ secrets.DATABASE_URL || 'postgresql://placeholder' }} >> apps/analytics/.env
          echo HASH_SALT=${{ secrets.HASH_SALT }} >> apps/analytics/.env
          echo MAXMIND_LICENSE_KEY=${{ secrets.MAXMIND_LICENSE_KEY }} >> apps/analytics/.env

      - name: Build Prisma client
        run: bun run --filter '@ouorz/analytics' build-postgresql-client

      - name: Build app
        run: bun run build:analytics
