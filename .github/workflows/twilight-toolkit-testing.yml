name: Twilight Toolkit Tests

on:
  push:
    branches:
      - main
    paths:
      - "packages/twilight-ui/**"
      - "packages/twilight-utils/**"
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - "turbo.json"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "packages/twilight-ui/**"
      - "packages/twilight-utils/**"
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - "turbo.json"
      - ".github/workflows/**"

jobs:
  run-smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Twilight Utilities
        run: bun run build:twilight:utils

      - name: Build Twilight UI Storybook
        run: bun run build:twilight:ui:storybook
