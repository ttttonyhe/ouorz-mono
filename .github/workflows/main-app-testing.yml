name: Main App Tests

on:
  push:
    branches:
      - main
    paths:
      - "apps/main/**"
      - "packages/twilight-ui/**"
      - "packages/twilight-utils/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/main/**"
      - "packages/twilight-ui/**"
      - "packages/twilight-utils/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/**"

jobs:
  run-cypress-tests:
    name: Run Cypress E2E Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: [1, 2, 3, 4, 5]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/cache@v4
        name: Setup Cypress cache
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup environment variables
        run: |
          touch apps/main/.env
          echo NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN }} >> apps/main/.env
          echo SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} >> apps/main/.env
          echo SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }} >> apps/main/.env
          echo SENTRY_ORG=${{ secrets.SENTRY_ORG }} >> apps/main/.env
          echo NEXT_PUBLIC_LC_KEY=${{ secrets.LC_KEY }} >> apps/main/.env
          echo NEXT_PUBLIC_LC_ID=${{ secrets.LC_ID }} >> apps/main/.env

      - name: Test cypress specs
        uses: cypress-io/github-action@v7
        with:
          install: false
          working-directory: apps/main
          start: bun run dev:test
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          record: true
          browser: chrome
          parallel: true
          group: "Main App Tests"
        env:
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
